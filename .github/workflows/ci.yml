name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint check (no-explicit-any enforcement)
        run: npx eslint . --max-warnings 0

      - name: Type check
        run: npx tsc --noEmit
        env:
          # Minimal env vars needed for type checking
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-secret
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Run Vitest tests (non-DB)
        run: npm run test:ci
        env:
          # Vitest tests (SlotEditor) use jsdom + mocked modules; no DB needed.
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-secret
