<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1565C0"/>
      <stop offset="100%" style="stop-color:#42A5F5"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E0F7FA;stop-opacity:0.85"/>
      <stop offset="60%" style="stop-color:#00E5FF;stop-opacity:0.55"/>
      <stop offset="100%" style="stop-color:#00ACC1;stop-opacity:0.4"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" fill="url(#bgGrad)"/>

  <!-- Subtle vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="0%" style="stop-color:#42A5F5;stop-opacity:0"/>
    <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:0.4"/>
  </radialGradient>
  <rect width="256" height="256" fill="url(#vignette)"/>

  <!-- Shadow under head -->
  <ellipse cx="128" cy="120" rx="34" ry="8" fill="#0D47A1" opacity="0.3" filter="url(#softBlur)"/>

  <!-- Head circle - glass effect -->
  <circle cx="128" cy="90" r="40" fill="url(#glassGrad)" stroke="#00E5FF" stroke-width="1.5" opacity="0.9" filter="url(#glow)"/>
  <!-- Head shine -->
  <ellipse cx="118" cy="76" rx="16" ry="10" fill="url(#shineGrad)" opacity="0.7"/>

  <!-- Shadow between head and body -->
  <ellipse cx="128" cy="132" rx="50" ry="10" fill="#0D47A1" opacity="0.25" filter="url(#softBlur)"/>

  <!-- Body / shoulders half-circle - glass effect -->
  <path d="M 48 210 A 80 80 0 0 1 208 210 Z" fill="url(#glassGrad)" stroke="#00E5FF" stroke-width="1.5" opacity="0.9" filter="url(#glow)"/>
  <!-- Body shine -->
  <path d="M 68 210 A 60 60 0 0 1 148 155 L 128 155 A 40 40 0 0 0 88 210 Z" fill="url(#shineGrad)" opacity="0.5"/>
</svg>
